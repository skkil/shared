<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mascot rig template</title>
<!--
  Template: code-built SVG character + GSAP rig. Replace shapes/colors with the project's character bible.
  Craft rules demonstrated: anticipation before action, asymmetric easing (sine.out up, power3.in down),
  squash on impact with volume kept (scaleX up when scaleY down), follow-through on arms, seeded random
  blinks, eyes that track the pointer, one state at a time, reduced-motion = static poses, pause offscreen.
-->
<style>
  :root { --ground:#E8EEF2; --ink:#14212B; --body:#F06A3A; --body-dark:#B9471F; --eye:#14212B; --cheek:#F7A889; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground:#13202A; --ink:#E8EEF2; } }
  :root[data-theme="dark"] { --ground:#13202A; --ink:#E8EEF2; }
  html, body { height:100%; margin:0; }
  body { background:var(--ground); color:var(--ink); font:16px/1.5 system-ui, sans-serif; display:grid; place-items:center; }
  .stage { width:min(92vw, 520px); }
  svg { width:100%; height:auto; display:block; overflow:visible; }
  .controls { display:flex; gap:12px; justify-content:center; margin-top:8px; }
  button { font:inherit; padding:10px 18px; border-radius:10px; border:2px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; }
  button:focus-visible { outline:3px solid var(--body); outline-offset:3px; }
</style>
</head>
<body>
<main class="stage">
  <svg viewBox="0 0 400 320" role="img" aria-label="Mascot character">
    <ellipse id="shadow" cx="200" cy="286" rx="70" ry="10" fill="var(--ink)" opacity="0.18"/>
    <g id="char">
      <g id="armL"><rect x="104" y="170" width="44" height="20" rx="10" fill="var(--body-dark)"/></g>
      <g id="armR"><rect x="252" y="170" width="44" height="20" rx="10" fill="var(--body-dark)"/></g>
      <rect x="160" y="262" width="26" height="20" rx="6" fill="var(--body-dark)"/>
      <rect x="214" y="262" width="26" height="20" rx="6" fill="var(--body-dark)"/>
      <g id="body">
        <rect x="132" y="120" width="136" height="150" rx="44" fill="var(--body)"/>
        <g id="face">
          <rect class="eye" x="170" y="170" width="14" height="22" rx="7" fill="var(--eye)"/>
          <rect class="eye" x="216" y="170" width="14" height="22" rx="7" fill="var(--eye)"/>
          <ellipse cx="160" cy="206" rx="9" ry="5" fill="var(--cheek)"/>
          <ellipse cx="240" cy="206" rx="9" ry="5" fill="var(--cheek)"/>
          <path id="mouth" d="M188 212 Q200 222 212 212" stroke="var(--eye)" stroke-width="5" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </svg>
  <div class="controls">
    <button id="wave" type="button">Wave</button>
    <button id="jump" type="button">Jump</button>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Seeded PRNG so timing "randomness" is reproducible across renders and reviews.
  const mulberry32 = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rnd = mulberry32(42);

  gsap.set("#armL", { svgOrigin: "146 180" });   // shoulder pivots
  gsap.set("#armR", { svgOrigin: "254 180" });
  gsap.set("#char", { svgOrigin: "200 282" });   // feet: squash from the ground up
  gsap.set("#shadow", { svgOrigin: "200 286" });
  gsap.set(".eye", { transformOrigin: "50% 50%" });

  let busy = false;
  const once = (build) => () => {
    if (busy) return;
    if (reduce) { build(true); return; }
    busy = true; idle.pause();
    build(false).eventCallback("onComplete", () => { busy = false; idle.resume(); });
  };

  // Idle: slow breathing; volume kept (y up, x slightly in).
  const idle = gsap.timeline({ repeat: -1, yoyo: true, paused: reduce })
    .to("#body", { scaleY: 1.025, scaleX: 0.99, transformOrigin: "50% 100%", duration: 1.8, ease: "sine.inOut" });

  // Blink at seeded random intervals (secondary action keeps the character alive without noise).
  const blink = () => gsap.delayedCall(2 + rnd() * 4, () =>
    gsap.to(".eye", { scaleY: 0.12, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut", onComplete: blink }));
  if (!reduce) blink();

  // Eyes follow the pointer (subtle; clamped).
  const ex = gsap.quickTo("#face", "x", { duration: 0.4, ease: "power3.out" });
  const ey = gsap.quickTo("#face", "y", { duration: 0.4, ease: "power3.out" });
  if (!reduce) addEventListener("pointermove", (e) => {
    const r = document.querySelector("svg").getBoundingClientRect();
    ex(gsap.utils.clamp(-6, 6, (e.clientX - (r.left + r.width / 2)) / 40));
    ey(gsap.utils.clamp(-4, 4, (e.clientY - (r.top + r.height / 2)) / 50));
  });

  const wave = (still) => {
    if (still) return gsap.set("#armR", { rotation: -130 });
    return gsap.timeline()
      .to("#armR", { rotation: 15, duration: 0.1, ease: "power2.in" })            // anticipation: dip first
      .to("#armR", { rotation: -140, duration: 0.22, ease: "back.out(2)" })
      .to("#armR", { rotation: -110, duration: 0.16, yoyo: true, repeat: 3, ease: "sine.inOut" })
      .to("#mouth", { attr: { d: "M186 210 Q200 228 214 210" }, duration: 0.15 }, 0.1)
      .to("#armR", { rotation: 0, duration: 0.35, ease: "power3.inOut" })
      .to("#mouth", { attr: { d: "M188 212 Q200 222 212 212" }, duration: 0.2 }, "<");
  };

  const jump = (still) => {
    if (still) return gsap.set("#char", { y: 0 });
    return gsap.timeline()
      .to("#char", { scaleY: 0.86, scaleX: 1.1, duration: 0.12, ease: "power2.in" })       // anticipation crouch
      .to("#char", { y: -96, scaleY: 1.08, scaleX: 0.94, duration: 0.32, ease: "sine.out" }) // rise: decelerate
      .to("#shadow", { scale: 0.55, opacity: 0.08, duration: 0.32, ease: "sine.out" }, "<")
      .to("#armL", { rotation: 35, duration: 0.18, ease: "power2.out" }, "<0.04")           // follow-through
      .to("#armR", { rotation: -35, duration: 0.18, ease: "power2.out" }, "<")
      .to("#char", { scaleY: 1, scaleX: 1, duration: 0.18 }, "<0.12")
      .to("#char", { y: 0, duration: 0.26, ease: "power3.in" })                             // fall: accelerate
      .to("#shadow", { scale: 1, opacity: 0.18, duration: 0.26, ease: "power3.in" }, "<")
      .to("#char", { scaleY: 0.84, scaleX: 1.12, duration: 0.07, ease: "power2.out" })      // impact squash
      .to(["#armL", "#armR"], { rotation: 0, duration: 0.3, ease: "power2.out" }, "<")
      // slop-ok: bounce-easing (character landing settle; overshoot is reserved for characters)
      .to("#char", { scaleY: 1, scaleX: 1, duration: 0.55, ease: "elastic.out(1, 0.45)" });
  };

  document.getElementById("wave").addEventListener("click", once(wave));
  document.getElementById("jump").addEventListener("click", once(jump));
  document.querySelector("#char").addEventListener("click", once(jump));

  // Pause everything when offscreen (battery, CPU).
  new IntersectionObserver(([e]) => e.isIntersecting ? gsap.globalTimeline.resume() : gsap.globalTimeline.pause())
    .observe(document.querySelector(".stage"));
})();
</script>
</body>
</html>
